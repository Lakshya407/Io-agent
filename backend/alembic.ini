# Alembic configuration.
#
# The database URL is intentionally NOT set here. It is resolved at runtime by
# migrations/env.py from the application settings (app.core.config), so the
# same .env-driven configuration is used for migrations and for the app.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# Timezone for the revision file name (defaults to UTC).
timezone = UTC

# Template used to generate empty migration files.
output_encoding = utf-8


[post_write_hooks]
# Run a formatter on generated migrations (optional, only if ruff is present).
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format migrations/versions/


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
