model_list:

  # Free provider via OmniRoute (DuckDuckGo AI Chat, no API key required)
  - model_name: openrouter-nemotron-3-ultra
    litellm_params:
      model: openai/openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
  # Free OpenRouter models via OmniRoute
  - model_name: openrouter-gemma-4-31b
    litellm_params:
      model: openai/openrouter/google/gemma-4-31b-it:free
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY

  - model_name: openrouter-minimax-m3.1-flash
    litellm_params:
      model: openai/openrouter/minimax/minimax-m3.1-flash:free
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY

  - model_name: openrouter-nemotron-3-ultra
    litellm_params:
      model: openai/openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY

  # Cloud model served by OpenAI
  - model_name: gpt-5-nano
    litellm_params:
      model: openai/gpt-5-nano
      api_key: os.environ/OPENAI_API_KEY
  # Local model served by Ollama
  - model_name: qwen2.5-0.5b
    litellm_params:
      model: ollama_chat/qwen2.5:0.5b
      api_base: http://host.docker.internal:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
