# Nginx configuration for the AI Agent Platform frontend.
#
# Serves the compiled Vite bundle with SPA history fallback and proxies the
# API + health probes to the FastAPI backend container. Because the browser
# and the API share one origin, no CORS is needed in production.

server {
    listen       80;
    listen  [::]:80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Proxy the versioned API to the backend service (container name: backend).
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Preserve the client request id for log correlation.
        proxy_set_header   X-Request-ID      $http_x_request_id;
        # Long enough for LLM responses. Must stay >= the frontend chat
        # timeout and <= the backend OLLAMA_REQUEST_TIMEOUT so a slow but
        # valid generation is never cut off by the proxy.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Liveness/readiness probes live outside /api/v1.
    location /health {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # FastAPI's interactive API docs + OpenAPI schema. Static assets for the
    # docs UI are served by the backend under /docs.
    location = /openapi.json {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
    location /docs {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
    location /redoc {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Static assets are content-hashed and may be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown routes render index.html so client-side routing
    # (/, /chat, /admin, /admin/users, …) works on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell — users must get the latest bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
